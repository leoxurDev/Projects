<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Music Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="player-container">
        <div class="player-background"></div>
        <div class="player-glass">
            <!-- Main Screen -->
            <div class="main-screen">

                <!-- Player Page -->
                <div id="player-page" class="page active">
                    <div class="album-art-container">
                        <img id="album-art" src="default-album-art.png" alt="Album Art">
                    </div>
                    <div class="song-info">
                        <h2 id="song-title">No Song Playing</h2>
                        <p id="song-artist">Add music to begin</p>
                    </div>
                    <div class="progress-container">
                        <input type="range" id="progress-bar" class="slider" value="0" min="0" max="100">
                        <div class="time-display">
                            <span id="current-time">0:00</span>
                            <span id="total-time">0:00</span>
                        </div>
                    </div>
                    <div class="controls">
                        <button id="prev-btn" class="control-btn"><i class="fas fa-backward"></i></button>
                        <button id="play-pause-btn" class="control-btn play-btn"><i class="fas fa-play"></i></button>
                        <button id="next-btn" class="control-btn"><i class="fas fa-forward"></i></button>
                    </div>
                    <div class="extra-controls">
                        <button id="shuffle-btn" class="control-btn-small"><i class="fas fa-random"></i></button>
                        <div class="volume-container">
                            <i class="fas fa-volume-down"></i>
                            <input type="range" id="volume-slider" class="slider" value="80" min="0" max="100">
                        </div>
                    </div>
                </div>

                <!-- Playlist Page -->
                <div id="playlist-page" class="page">
                    <div class="page-header">
                        <h2>Playlist</h2>
                        <button id="add-music-btn" class="control-btn-small"><i class="fas fa-plus"></i> Add Music</button>
                        <input type="file" id="file-input" multiple accept="audio/*" hidden>
                    </div>
                    <ul id="playlist" class="playlist">
                        <!-- Playlist items will be added here -->
                    </ul>
                </div>

                <!-- Legacy Basic EQ Page (optional) -->
                <div id="equalizer-page" class="page">
                    <div class="page-header">
                        <h2>Basic Equalizer</h2>
                    </div>
                    <div class="equalizer-placeholder">
                        <p>Basic equalizer controls (legacy placeholder)</p>
                        <i class="fas fa-sliders-h fa-3x"></i>
                    </div>
                </div>

                <!-- Dolby Atmos Equalizer + Visualizers -->
                <div id="eq-panel" class="page">
                    <div class="page-header">
                        <h2>Dolby Atmos Equalizer</h2>
                    </div>

                    <!-- Preset selector -->
                    <div class="preset-bar">
                        <label for="presetSelect">Preset:</label>
                        <select id="presetSelect">
                            <option>Studio</option>
                            <option>Movie</option>
                            <option>Dynamic</option>
                            <option>Voice</option>
                        </select>
                    </div>

                    <!-- Sliders auto-generated by script.js -->
                    <div class="eq-sliders"></div>

                    <!-- Frequency spectrum & stereo-direction visualizers -->
                    <div class="visualizer-container">
                        <h3>Frequency + Direction</h3>
                        <canvas id="fftCanvas" width="320" height="100"></canvas>
                        <canvas id="panCanvas" width="320" height="30"></canvas>
                    </div>
                </div>
            </div>

            <!-- Navigation Bar -->
            <div class="navigation-bar">
                <button class="nav-btn active" data-page="player-page"><i class="fas fa-music"></i> Player</button>
                <button class="nav-btn" data-page="playlist-page"><i class="fas fa-list-ul"></i> Playlist</button>
                <button class="nav-btn" data-page="equalizer-page"><i class="fas fa-sliders-h"></i> EQ</button>
                <button class="nav-btn" data-page="eq-panel"><i class="fas fa-atom"></i> Atmos</button>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>
    <!-- jsmediatags for reading audio metadata -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
